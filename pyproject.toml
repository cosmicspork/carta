[project]
name = "carta"
version = "0.1.0"
description = "SQL queries to Outlook-ready .eml drafts with xlsx attached."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "polars>=1.0,<2",
    "xlsxwriter>=3.2",
    "pydantic>=2.5,<3",
    "keyring>=25",
]

# Per-backend driver extras. SQLite is built into Python, no extra needed.
# Install the one you use, e.g. `uv sync --extra oracle`.
[project.optional-dependencies]
oracle = ["oracledb>=2.0"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mssql = ["pyodbc>=5.0"]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "openpyxl>=3.1,<4",
]

[project.scripts]
carta = "carta.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carta"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["xlsxwriter.*", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
